<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAid Login/Register</title>

  <!-- Bootstrap + Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <style>
    body {
      background-color: #f8f9fc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .auth-card {
      max-width: 400px;
      width: 100%;
    }
    .logo {
      max-width: 150px;
    }
  </style>
</head>
<body>
  <div class="card p-4 shadow auth-card">
    <div class="text-center mb-3">
      <img src="assets/images/maid-logo.png" alt="MAid Logo" class="logo mb-2">
      <h4 class="fw-bold">Login</h4>
    </div>

    <form id="login-form">
      <div class="mb-3">
        <label for="login-username" class="form-label">Username</label>
        <input type="text" class="form-control" id="login-username" required />
      </div>
      <div class="mb-3">
        <label for="login-password" class="form-label">Password</label>
        <input type="password" class="form-control" id="login-password" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <hr />

    <form id="register-form">
      <h4 class="text-center fw-bold">Register</h4>
      <div class="mb-3">
        <label for="reg-username" class="form-label">Username</label>
        <input type="text" class="form-control" id="reg-username" required />
      </div>
      <div class="mb-3">
        <label for="reg-password" class="form-label">Password</label>
        <input type="password" class="form-control" id="reg-password" required />
      </div>
      <button type="submit" class="btn btn-outline-secondary w-100">Register</button>
    </form>
  </div>

  <!-- JS Scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const registerForm = document.getElementById('register-form');
      const loginForm = document.getElementById('login-form');

      if (registerForm) {
        registerForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const username = document.getElementById('reg-username').value;
          const password = document.getElementById('reg-password').value;

          const response = await fetch('http://localhost:3000/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();
          alert(data.message || 'Registration complete');
          registerForm.reset();
        });
      }

      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const username = document.getElementById('login-username').value;
          const password = document.getElementById('login-password').value;

          try {
            const response = await fetch('http://localhost:3000/api/users/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (!response.ok) {
              alert(data.error || 'Login failed');
              return;
            }

            alert(data.message || 'Login successful');
            loginForm.reset();
            if (data.message === 'Login successful') {
              window.location.href = 'dashboard.html';
            }
          } catch (err) {
            alert('An error occurred. Please try again.');
            console.error(err);
          }
        });
      }
    });
  </script>
</body>
</html>
