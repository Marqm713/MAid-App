      <h2 class="mb-4">The Medical Assistant Identifier App - BMI Calculator</h2>
      <div class="card p-4 shadow-sm">
        <h3 class="mb-3">Body Mass Index (US Units)</h3>
        <form id="bmi-form">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="feet" class="form-label">Height (Feet)</label>
              <input type="number" id="feet" class="form-control" placeholder="Feet" required />
            </div>
            <div class="col-md-6">
              <label for="inches" class="form-label">Height (Inches)</label>
              <input type="number" id="inches" class="form-control" placeholder="Inches" required />
            </div>
            <div class="col-md-12">
              <label for="pounds" class="form-label">Weight (lbs)</label>
              <input type="number" id="pounds" class="form-control" placeholder="Pounds" required />
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Calculate BMI</button>
        </form>


        <div class="mt-4">
          <label for="bmi-output" class="form-label">Result</label>
          <textarea id="bmi-output" class="form-control" rows="2" readonly placeholder="Your BMI result will appear here..."></textarea>
        </div>
      </div>
    </div>
